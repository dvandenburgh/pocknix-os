name: Package request
description: Ask for a package to be hosted in the pocknix repos
labels: ["triage", "package-request"]
body:
  - type: markdown
    attributes:
      value: >
        The locked base hosts a curated set, not all of Arch. Full Arch Linux ARM is one
        command away: `sudo pocknix-base rolling` (unsupported). A package earns a place
        here when it serves the device as a handheld and rolling mode is overkill for
        that. The rules are in
        [CONTRIBUTING.md](https://github.com/shuuri-labs/pocknix-os/blob/main/CONTRIBUTING.md#requesting-a-package).
        Fill this in and the triage is mostly done.
  - type: input
    id: package
    attributes:
      label: Package name(s)
      description: Exactly as Arch or the AUR spells them.
      placeholder: "kexec-tools"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where does it live today?
      options:
        - Arch Linux ARM core/extra (plain pacman on Arch ARM)
        - AUR only
        - Upstream only, not packaged for Arch
        - Not sure
    validations:
      required: true
  - type: textarea
    id: handheld_use
    attributes:
      label: What does it do for you on the handheld?
      description: >
        The concrete thing you do with the device that this unlocks. "It's useful" or
        "Arch has it" is not enough on its own.
    validations:
      required: true
  - type: checkboxes
    id: alternatives
    attributes:
      label: What have you already tried?
      options:
        - label: Flatpak via Discover (no build, or no aarch64 build)
        - label: pacman -U straight from the Arch Linux ARM mirror
        - label: makepkg from the AUR (base-devel and git are in the base, pacman -S installs them)
        - label: rolling mode works, but I want it on a locked device (say why above)
  - type: input
    id: devices
    attributes:
      label: Which device(s)?
      placeholder: "RP5, all SM8550, all devices, ..."
    validations:
      required: false
  - type: dropdown
    id: involvement
    attributes:
      label: Would you want to help?
      options:
        - Just suggesting
        - Happy to test it on my device
        - Interested in maintaining the package
    validations:
      required: false
