# config/tuning/sm8250.conf — per-SoC userspace compiler tuning. POSIX sh,
# sourced by scripts/lib.sh right after kernel/${SOC}/kernel.conf; consumed by
# build-packages.sh, which passes the values into makepkg's environment for the
# packages/soc PKGBUILDs.
#
# The Snapdragon 865 is 4x A77 + 4x A55 (armv8.2, no SVE/armv9); gcc has no
# a77.a55 big.LITTLE tune pair, so the adjacent a76.a55 pair is used.
: "${POCKNIX_TUNE_CFLAGS:=-march=armv8.2-a+crypto+crc+fp+simd -mtune=cortex-a76.cortex-a55 -mno-outline-atomics}"

# FEX engine tuning: the JIT output is runtime-tuned to the real CPU regardless,
# and FEX worker threads land on the littles too, so the engine is tuned for the
# weakest core it runs on (same reasoning as sm8550.conf, one step further down).
: "${POCKNIX_FEX_TUNE_CPU:=cortex-a55}"
