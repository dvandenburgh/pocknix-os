# /usr/lib/pocknix/boards/family.conf: facts every SM8250 board shares, sourced first by
# each board file (a board may override).
POCKNIX_SOC=sm8250

# Panel: CH13726A AMOLED, native 1080x1920@60 PORTRAIT, mounted rotation=270 (DTS) -> landscape.
# W/H are the panel's NATIVE portrait mode; pocknix-steam transposes them to logical landscape
# for left/right and rotation autodetects.
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=60
POCKNIX_PANEL_ORIENT=left        # gamescope --force-orientation
POCKNIX_PANEL_MM=177x100         # fake: gamepadui DPI, see devices/README.md
POCKNIX_PANEL_HDR_NITS=580       # HDR peak (gamescope --hdr-itm-target-nits); CH13726A profile in 10-pocknix
POCKNIX_DESKTOP_ROTATE=left      # kscreen-doctor rotation token
POCKNIX_DESKTOP_SCALE=2.5        # same panel res/size class as the RP6

# Cores games and emulators are pinned to (read through pocknix-bsp-common's cores.sh):
# Snapdragon 865 = cpu0-3 A55 (little), cpu4-7 A77 (big).
POCKNIX_BIG_CORES=4-7

# --- install-to-internal contract (arm-efi) -----------------------------------
# Internal main LUN = /dev/sda: Android GPT with userdata as the LAST partition, so the
# shrink-and-append flow applies. The boot chain (abl_a/b, boot_a/b, tz, ...) lives on the
# separate /dev/sde LUN and is never touched. BOOT_STYLE selects the arm-efi handling in the
# installer scripts (grub.cfg + fstab pinned to the internal PARTUUIDs at install time).
POCKNIX_BOOT_STYLE=arm-efi
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=POCKNIX
POCKNIX_BOOT_FAT_LABEL=POCKNIX
POCKNIX_ROOT_LABEL=POCKNIX_ROOT
