# /usr/lib/pocknix/boards/rpflip2.conf: Retroid Pocket Flip 2, on top of boards/family.conf.
# The Flip2 DTS #includes the RP5's (same panel, gamepad MCU, RetroidPocket sound card) and
# adds only the lid hall sensor (SW_LID); logind's default HandleLidSwitch=suspend covers it.
. /usr/lib/pocknix/boards/family.conf
POCKNIX_DEVICE=rpflip2
