# pocknix-perfd's SM8250 data, layered over /usr/share/pocknix/power-profiles.conf: the
# [underclock.SM8250.<level>] caps (kHz, every policy) and [profile.<id>.SM8250] overlays only.
# scripts/check-power-profiles.py checks every cap against devices/sm8250/freqs.txt.

# simple_ondemand hunts down under FEX on the A650 (#52); a 700 MHz floor holds frame pacing.
[profile.Performance.SM8250]
gpu_min = 0.75

# Little cores cost little power and run latency-sensitive helpers: policy0 stays stock in
# small and only drops to ~90% in large.
[underclock.SM8250.small]
policy0 = 1804800
policy4 = 2054400
policy7 = 2361600

[underclock.SM8250.medium]
policy0 = 1420800
policy4 = 1766400
policy7 = 1977600

[underclock.SM8250.large]
policy0 = 1612800
policy4 = 1574400
policy7 = 1747200
