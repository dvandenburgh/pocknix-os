# pocknix (sm8250): keep PipeWire OFF the hardware mixer for the RetroidPocket
# card. pocknix-sm8250-audio-heal plants hot hardware gains for the tiny
# speakers (the UCM BootSequence never runs), and PipeWire's hardware-volume
# mapping treats 100% as 0dB total path gain, so it would pull them back down.
# soft-mixer leaves those gains planted and applies volume in software below
# that ceiling.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "RetroidPocket" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
