# /usr/lib/pocknix/boards/rp6.conf: Retroid Pocket 6, on top of boards/family.conf.
# These are also every consumer's built-in fallback values.
. /usr/lib/pocknix/boards/family.conf
POCKNIX_DEVICE=rp6

# Panel: native 1080x1920@120 portrait, mounted rotation=270 -> landscape 1920x1080.
# W/H are the panel's NATIVE portrait mode; pocknix-steam transposes them to logical landscape
# for left/right and rotation autodetects.
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=120
POCKNIX_PANEL_ORIENT=left        # gamescope --force-orientation
POCKNIX_PANEL_HDR_NITS=750       # HDR peak (gamescope --hdr-itm-target-nits); Visionox VTDR6130 profile in 10-pocknix
POCKNIX_DESKTOP_ROTATE=left      # kscreen-doctor rotation token
POCKNIX_DESKTOP_SCALE=2.5
