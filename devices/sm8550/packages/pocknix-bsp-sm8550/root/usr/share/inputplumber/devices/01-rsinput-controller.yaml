# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# InputPlumber composite device for the Retroid Pocket 6 gamepad (RSInput MCU), both the
# standard and TOP-DPAD models: the in-kernel RSInput driver (phys "rsinput-gamepad/input0")
# with the paddles + volume-up rocker on a separate gpio-keys node, and a capability_map that
# fixes the driver quirks (X/Y swap, explicit d-pad, Guide/QuickAccess). Gated on the
# devicetree model so the config only activates on RP6 hardware.
#
# gpio-keys is grabbed as a second source: the DTS wires the back paddles
# there as BTN_Z (left) / BTN_C (right); left ungrabbed, Steam sees them as a
# stray "gpio keys" controller. The map folds them into the deck pad as
# LeftPaddle1/RightPaddle1 (the Deck's L4/L5 back buttons). That node also
# carries the volume-up rocker (KEY_VOLUMEUP); because the grab is exclusive,
# the map re-emits it on the keyboard target so volume up keeps working.
# (Gyro is still unavailable — no IIO/IMU.)
#
# Target = `deck` (Steam Deck controller) so Steam Input gets a first-class
# Steam-native pad.
version: 1
kind: CompositeDevice
name: SM8550 family (RSInput)

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket 6
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket 6 TOP-DPAD

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: sm8550_gamepad

  # Back paddles (+ volume-up rocker) live here, not on the gamepad node.
  - group: gamepad
    evdev:
      name: gpio-keys
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: sm8550_gamepad

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
