# pocknix-perfd's SM8550 data, layered over /usr/share/pocknix/power-profiles.conf: the
# [underclock.SM8550.<level>] caps (kHz, every policy) and [profile.<id>.SM8550] overlays only.
# scripts/check-power-profiles.py checks every cap against devices/sm8550/freqs.txt.

# Little cores cost little power and run latency-sensitive helpers: policy0 stays stock in
# small, ~94% in medium and ~89% in large.
[underclock.SM8550.small]
policy0 = 2016000
policy3 = 2323200
policy7 = 2476800

[underclock.SM8550.medium]
policy0 = 1900800
policy3 = 2054400
policy7 = 2092800

[underclock.SM8550.large]
policy0 = 1785600
policy3 = 1785600
policy7 = 1843200
