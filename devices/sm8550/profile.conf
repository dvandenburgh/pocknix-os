# POSIX sh, sourced by scripts/lib.sh after config/pocknix.conf; the environment overrides it.

DEVICE_PRETTY="SM8550 family (Retroid Pocket 6 / Nova, AYN Odin 2 family / Thor)"
DEVICE_HOSTNAME="pocknix"     # kernel CONFIG_DEFAULT_HOSTNAME only; the image sets the real one
: "${SOC:=sm8550}"

# qcom-abl: GPT p1 FAT (KERNEL + KERNEL.md5), p2 root.
: "${BOOTLOADER:=qcom-abl}"
: "${SD_FAT_LABEL:=POCKNIX}"        # the ABL scans FAT partitions, never the label
: "${SD_BOOT_PARTNAME:=system}"
: "${ROOT_LABEL:=POCKNIX_ROOT}"

# No initramfs: UFS/SCSI and the root fs are built in. The BSP's kernel-cmdline must byte-match this
# (build-packages.sh).
: "${KERNEL_CMDLINE_ROOT:=root=PARTLABEL=${ROOT_LABEL} rw}"
: "${KERNEL_CMDLINE_EXTRA:=quiet loglevel=3 systemd.show_status=false splash logo.nologo plymouth.ignore-serial-consoles rootwait console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat irqaffinity=0-2 cgroup.memory=nokmem,nosocket nosoftlockup usbcore.interrupt_interval_override=045e:028e:2 ufshcd_core.uic_cmd_timeout=3000 mem_sleep_default=s2idle}"
: "${KERNEL_CMDLINE:=${KERNEL_CMDLINE_ROOT} ${KERNEL_CMDLINE_EXTRA}}"

# mangohud's GPU temperature: the hwmon name of the GPU thermal zone (the SoC dts names it).
: "${GPU_HWMON:=gpuss_0_thermal}"

: "${DEVICE_BSP_PKG:=pocknix-bsp-sm8550}"
: "${DEVICE_META_PKG:=pocknix-device-sm8550}"
: "${KERNEL_PKG:=linux-pocknix-${SOC}}"
