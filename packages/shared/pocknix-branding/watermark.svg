<?xml version="1.0" encoding="UTF-8"?>
<!-- Plymouth watermark: the logo alone (no wordmark on the boot screen), in LOGICAL pixels.
     two-step draws images at DeviceScale (2x here), so 266x252 fills 532x504 device pixels: the
     height the logo and wordmark took together. The logo box (0,0 266x252) is shared with
     throbber.svg so the particles land on their orbits. The 36 transparent rows below it are what
     line the two up: see the alignment note in the PKGBUILD. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="266" height="288" viewBox="0 0 266 288" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <image x="0" y="1.74" width="266" height="248.52" xlink:href="logo.svg"/>
</svg>
