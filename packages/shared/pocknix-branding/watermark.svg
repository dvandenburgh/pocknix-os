<?xml version="1.0" encoding="UTF-8"?>
<!-- Plymouth watermark: logo over wordmark, in LOGICAL pixels. two-step draws images at
     DeviceScale (2x here), so authoring larger would overflow a 540-line logical screen.
     Rendered to watermark.png by the PKGBUILD; pocknix-steam-splash shows the same file. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="220" height="250" viewBox="0 0 220 250">
  <image x="0" y="0" width="220" height="205.5" xlink:href="logo.svg"/>
  <image x="20" y="225.5" width="180" height="24.5" xlink:href="wordmark.png"/>
</svg>
