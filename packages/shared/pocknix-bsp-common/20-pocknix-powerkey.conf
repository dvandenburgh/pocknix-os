# The kernel no longer reports the press that wakes the device (patch 1080), so logind can own
# the key: short press suspends, a 5 s hold powers off. A desktop's power manager takes it over
# with its own inhibitor while that session runs, and so does game mode, which hands the key to
# Steam (pocknix-steam runs pocknix-powerbuttond).
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
