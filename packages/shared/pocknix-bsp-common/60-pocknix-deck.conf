# No rtprio on purpose: Wine promotes every "time critical" game thread to SCHED_RR when
# RLIMIT_RTPRIO allows it, and those threads starve the compositor (the game stays SCHED_OTHER).
# nice -8: games cannot out-nice PipeWire (-11) or tie gamescope, which reaches -20 through
# cap_sys_nice. memlock: Proton, pressure-vessel and some anti-cheat pin memory.
deck    -    nice       -8
deck    -    memlock    unlimited
