# Directory and inode caches survive reclaim longer than page cache (default 100): Wine prefixes
# and game installs are trees of tens of thousands of files, and every miss is a lookup on the
# SD card or UFS.
vm.vfs_cache_pressure = 50

# Dirty pages are written back every 15 s instead of 5: fewer flusher wakeups and larger,
# coalesced writes to the flash. 60-pocknix-gaming.conf's dirty_bytes cap still bounds how much
# can wait.
vm.dirty_writeback_centisecs = 1500

# A fast Wi-Fi download can outrun a busy CPU's packet processing; the default 1000-packet
# backlog then drops packets and TCP backs off.
net.core.netdev_max_backlog = 4096
