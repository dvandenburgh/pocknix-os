[Service]
# Stock rtkit clamps PipeWire's RR 88 request to 20, under the display threads' FIFO 50 and
# gamescope. 80 sits PipeWire beside the audio irq threads and below the GPU/display ones.
# No --no-polkit: Arch's rtkit lacks it and exits; polkit already allows the active session.
ExecStart=
ExecStart=/usr/lib/rtkit-daemon --our-realtime-priority=81 --max-realtime-priority=80 --threads-per-user-max=200 --actions-per-burst-max=1000
