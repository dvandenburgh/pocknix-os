# Compressed-RAM swap: headroom for big games, Waydroid and in-game Steam downloads without
# touching flash. vm.swappiness and vm.page-cluster for it are in 60-pocknix-gaming.conf.
[zram0]
# Sized to total RAM: the device is elastic, only the compressed pages occupy memory.
zram-size = ram
# lz4 first: pages are compressed under memory pressure (often mid-load) and decompressed on
# every swap-in fault, and lz4 does both several times faster than zstd. zstd is the
# recompression algorithm: pocknix-zram-recompress.timer moves pages left untouched since its
# last pass to zstd, so cold memory still packs at zstd's ratio.
compression-algorithm = lz4 zstd
# Highest priority: zram is the only swap that should ever take pages.
swap-priority = 100
fs-type = swap
